    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    </head>

    <body>
        <div class="container d-flex justify-content-center align-items-center min-vh-100">
            <div class="card" style="width: 30%;">
                <div class="card-header">
                    ADD DOCTOR DETAILS
                </div>
                <div class="card-body">
                    <form method="POST" action="/add_doc">
  <div class="form-floating mb-3">
    <input type="text" class="form-control" id="floatingName" name="name" placeholder="Doctor Name" required>
    <label for="floatingName">Name</label>
  </div>

  <div class="form-floating mb-3">
    <input type="email" class="form-control" id="floatingEmail" name="email" placeholder="name@example.com" required>
    <label for="floatingEmail">Email address</label>
  </div>

  <div class="form-floating mb-3">
    <input type="password" class="form-control" id="floatingPassword" name="password" placeholder="Password" required>
    <label for="floatingPassword">Password</label>
  </div>

  <!-- <div class="form-floating mb-3"> -->
    <!-- <input type="text" class="form-control" id="floatingDepartment" name="department" placeholder="Department" required> -->
    <!-- <label for="floatingDepartment">Department</label> -->
  <!-- </div> -->

  <div class="form-floating mb-3">
    <input type="text" class="form-control" id="floatingDeptID" name="dept_id" placeholder="Department ID" required>
    <label for="floatingDeptID">Department ID</label>
  </div>

  <div class="form-floating mb-3">
    <input type="text" class="form-control" id="floatingStatus" name="status" placeholder="Status" required>
    <label for="floatingStatus">Status</label>
  </div>

  <button type="submit" class="btn btn-warning">Add Doctor</button>
  <a href="{{url_for('admin_dashboard')}}"class="btn btn-outline-secondary">Back to dashboard</a>
</form>


                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
            crossorigin="anonymous"></script>
    </body>
</html>
